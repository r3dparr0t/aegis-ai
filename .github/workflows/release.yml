name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x64 package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          stage="dist/aegis-ai-${version}-linux-x64"
          mkdir -p "$stage/reports"
          cp target/release/aegis-ai "$stage/"
          cp aegis.toml providers.toml .env.example README.md LICENSE "$stage/"
          cp -a labs boxes migrations prompts static scripts "$stage/"
          chmod +x "$stage/aegis-ai"
          (cd dist && zip -qr "aegis-ai-${version}-linux-x64.zip" "aegis-ai-${version}-linux-x64")

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ai-linux-x64
          path: dist/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 package
    runs-on: windows-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Assemble package
        shell: pwsh
        run: |
          $version = "${{ inputs.tag || github.ref_name }}"
          $name = "aegis-ai-$version-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path "$stage/reports" | Out-Null
          Copy-Item "target/release/aegis-ai.exe" $stage
          Copy-Item @("aegis.toml", "providers.toml", ".env.example", "README.md", "LICENSE") $stage
          Copy-Item @("labs", "boxes", "migrations", "prompts", "static", "scripts") $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "$env:RUNNER_TEMP/$name.zip" -Force

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ai-windows-x64
          path: ${{ runner.temp }}/*.zip
          if-no-files-found: error

  publish-assets:
    name: Attach packages to GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aegis-ai-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true
