name: Build Linux release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x64 package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && 'main' || github.ref }}
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          stage="dist/aegis-ai-${version}-linux-x64"
          mkdir -p "$stage/reports"
          cp target/release/aegis-ai "$stage/"
          cp aegis.toml providers.toml .env.example README.md LICENSE "$stage/"
          cp -a labs boxes migrations prompts static scripts "$stage/"
          chmod +x "$stage/aegis-ai"
          (cd dist && zip -qr "aegis-ai-${version}-linux-x64.zip" "aegis-ai-${version}-linux-x64")

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ai-linux-x64
          path: dist/*.zip
          if-no-files-found: error

  publish-assets:
    name: Attach Linux package to GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aegis-ai-linux-x64
          merge-multiple: true

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true
